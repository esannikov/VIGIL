<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1900" viewBox="0 0 1400 1900" role="img" aria-labelledby="title desc">
  <title id="title">VIGIL autonomous art cycle with reflective memory</title>
  <desc id="desc">A vertical map of VIGIL. World signals become a daily tension, five artistic positions and five generated images. VIGIL reads the pixels and chooses one work before human feedback. Reviewed traces return later through reflective memory. Human authority controls publication and durable method promotion.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050713"/>
      <stop offset="0.48" stop-color="#0a1025"/>
      <stop offset="1" stop-color="#101b31"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17213d" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#10182e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="surfaceViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#291d52" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#15172f" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="surfaceGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d3b" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#102527" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="lineBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49d6ff"/>
      <stop offset="1" stop-color="#696cff"/>
    </linearGradient>
    <linearGradient id="lineViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c47cff"/>
      <stop offset="1" stop-color="#7868ff"/>
    </linearGradient>
    <linearGradient id="lineGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58e6b5"/>
      <stop offset="1" stop-color="#39bfa4"/>
    </linearGradient>
    <radialGradient id="field" cx="50%" cy="30%" r="78%">
      <stop offset="0" stop-color="#334a9d" stop-opacity="0.26"/>
      <stop offset="0.48" stop-color="#542b88" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#050713" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5fbfff"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a77cff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#51d7b0"/>
    </marker>
    <style>
      .title { font: 700 72px Arial, sans-serif; fill: #f7f8ff; letter-spacing: 0; }
      .subtitle { font: 400 27px Arial, sans-serif; fill: #bfc9e8; }
      .eyebrow { font: 700 18px Arial, sans-serif; fill: #76d5ff; letter-spacing: 3px; }
      .section { font: 700 18px Arial, sans-serif; fill: #8392bd; letter-spacing: 2.5px; }
      .step { font: 700 18px Arial, sans-serif; fill: #7fdcff; letter-spacing: 1.5px; }
      .stepViolet { font: 700 18px Arial, sans-serif; fill: #c7a2ff; letter-spacing: 1.5px; }
      .stepGreen { font: 700 18px Arial, sans-serif; fill: #7ce7c6; letter-spacing: 1.5px; }
      .cardTitle { font: 700 34px Arial, sans-serif; fill: #ffffff; }
      .cardCopy { font: 400 22px Arial, sans-serif; fill: #c9d2ec; }
      .sideTitle { font: 700 28px Arial, sans-serif; fill: #ffffff; }
      .sideCopy { font: 400 20px Arial, sans-serif; fill: #c8cee7; }
      .flowLabel { font: 700 16px Arial, sans-serif; fill: #8aa6e8; letter-spacing: 1.5px; }
      .flowLabelViolet { font: 700 16px Arial, sans-serif; fill: #c3a1ff; letter-spacing: 1.5px; }
      .flowLabelGreen { font: 700 16px Arial, sans-serif; fill: #75ddbf; letter-spacing: 1.5px; }
      .card { fill: url(#surface); stroke: url(#lineBlue); stroke-width: 2; }
      .cardViolet { fill: url(#surfaceViolet); stroke: url(#lineViolet); stroke-width: 2; }
      .cardGreen { fill: url(#surfaceGreen); stroke: url(#lineGreen); stroke-width: 2; }
      .spine { fill: none; stroke: url(#lineBlue); stroke-width: 5; marker-end: url(#arrowBlue); filter: url(#glow); }
      .memoryFlow { fill: none; stroke: url(#lineViolet); stroke-width: 4; stroke-dasharray: 11 10; marker-end: url(#arrowViolet); }
      .humanFlow { fill: none; stroke: url(#lineGreen); stroke-width: 5; marker-end: url(#arrowGreen); }
      .returnFlow { fill: none; stroke: url(#lineGreen); stroke-width: 3; stroke-dasharray: 12 11; stroke-opacity: 0.62; marker-end: url(#arrowGreen); }
      .fineRule { stroke: #8aa4e0; stroke-opacity: 0.22; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1400" height="1900" fill="url(#background)"/>
  <rect width="1400" height="1900" fill="url(#field)"/>
  <path d="M0 330 H1400 M0 1495 H1400" class="fineRule"/>

  <text x="110" y="104" class="eyebrow">VIGIL / V6 ALPHA / SYSTEM MAP</text>
  <text x="110" y="194" class="title">A machine that remembers</text>
  <text x="110" y="246" class="subtitle">It senses the world, makes five artistic decisions, reads the pixels,</text>
  <text x="110" y="284" class="subtitle">chooses one work, and lets reviewed experience alter what comes next.</text>

  <text x="110" y="375" class="section">AUTONOMOUS CYCLE</text>

  <g filter="url(#shadow)">
    <rect x="330" y="410" width="740" height="150" rx="8" class="card"/>
    <rect x="330" y="410" width="12" height="150" rx="6" fill="url(#lineBlue)"/>
    <text x="378" y="455" class="step">01 / SENSE</text>
    <text x="378" y="505" class="cardTitle">World signals become evidence</text>
    <text x="378" y="538" class="cardCopy">Events, attention and slow conditions retain source boundaries.</text>
  </g>

  <path d="M700 560 V610" class="spine"/>

  <g filter="url(#shadow)">
    <rect x="330" y="620" width="740" height="150" rx="8" class="card"/>
    <rect x="330" y="620" width="12" height="150" rx="6" fill="url(#lineBlue)"/>
    <text x="378" y="665" class="step">02 / FRAME</text>
    <text x="378" y="715" class="cardTitle">World Reader forms the tension</text>
    <text x="378" y="748" class="cardCopy">One bounded claim, one uncertainty and one counter-reading.</text>
  </g>

  <path d="M700 770 V820" class="spine"/>

  <g filter="url(#shadow)">
    <rect x="330" y="830" width="740" height="150" rx="8" class="card"/>
    <rect x="330" y="830" width="12" height="150" rx="6" fill="url(#lineBlue)"/>
    <text x="378" y="875" class="step">03 / IMAGINE</text>
    <text x="378" y="925" class="cardTitle">Five autonomous positions</text>
    <text x="378" y="958" class="cardCopy">Artistic Reasoner and Concept Critic develop distinct visual acts.</text>
  </g>

  <path d="M700 980 V1030" class="spine"/>

  <g filter="url(#shadow)">
    <rect x="330" y="1040" width="740" height="150" rx="8" class="card"/>
    <rect x="330" y="1040" width="12" height="150" rx="6" fill="url(#lineBlue)"/>
    <text x="378" y="1085" class="step">04 / MAKE</text>
    <text x="378" y="1135" class="cardTitle">Five images enter the world</text>
    <text x="378" y="1168" class="cardCopy">Prompt Director translates each position for GPT Image 2.</text>
  </g>

  <path d="M700 1190 V1240" class="spine"/>

  <g filter="url(#shadow)">
    <rect x="330" y="1250" width="740" height="150" rx="8" class="card"/>
    <rect x="330" y="1250" width="12" height="150" rx="6" fill="url(#lineBlue)"/>
    <text x="378" y="1295" class="step">05 / REFLECT</text>
    <text x="378" y="1345" class="cardTitle">The pixels answer back</text>
    <text x="378" y="1378" class="cardCopy">Blind reading precedes informed criticism and comparison.</text>
  </g>

  <path d="M700 1400 V1450" class="spine"/>

  <g filter="url(#shadow)">
    <rect x="330" y="1460" width="740" height="150" rx="8" class="card"/>
    <rect x="330" y="1460" width="12" height="150" rx="6" fill="url(#lineBlue)"/>
    <text x="378" y="1505" class="step">06 / CHOOSE</text>
    <text x="378" y="1555" class="cardTitle">VIGIL commits to one work</text>
    <text x="378" y="1588" class="cardCopy">The choice is fixed before the human verdict is known.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="795" width="250" height="188" rx="8" class="cardViolet"/>
    <text x="70" y="838" class="stepViolet">MEMORY</text>
    <text x="70" y="882" class="sideTitle">Hindsight recall</text>
    <text x="70" y="918" class="sideCopy">Reviewed traces,</text>
    <text x="70" y="947" class="sideCopy">failures and methods</text>
    <text x="70" y="976" class="sideCopy">return after framing.</text>
  </g>
  <path d="M290 890 C312 890 318 875 330 875" class="memoryFlow"/>
  <text x="40" y="1023" class="flowLabelViolet">ADVISORY, NEVER FACTUAL</text>

  <g filter="url(#shadow)">
    <rect x="1110" y="1202" width="250" height="200" rx="8" class="cardViolet"/>
    <text x="1140" y="1245" class="stepViolet">TRACE</text>
    <text x="1140" y="1288" class="sideTitle">Nothing disappears</text>
    <text x="1140" y="1324" class="sideCopy">Sources, prompts,</text>
    <text x="1140" y="1353" class="sideCopy">pixels, criticism</text>
    <text x="1140" y="1382" class="sideCopy">and choice stay bound.</text>
  </g>
  <path d="M1070 1535 C1185 1510 1235 1450 1235 1402" class="memoryFlow"/>

  <text x="110" y="1688" class="section">HUMAN AUTHORITY</text>

  <g filter="url(#shadow)">
    <rect x="110" y="1720" width="520" height="120" rx="8" class="cardGreen"/>
    <text x="150" y="1762" class="stepGreen">07 / VERDICT</text>
    <text x="150" y="1810" class="sideTitle">Accept, reject or correct</text>
  </g>

  <path d="M630 1780 H760" class="humanFlow"/>

  <g filter="url(#shadow)">
    <rect x="770" y="1720" width="520" height="120" rx="8" class="cardGreen"/>
    <text x="810" y="1762" class="stepGreen">08 / RELEASE</text>
    <text x="810" y="1810" class="sideTitle">Publish or promote a method</text>
  </g>

  <path d="M1030 1840 V1870 H20 V1020 H165 V991" class="returnFlow"/>
  <text x="530" y="1878" class="flowLabelGreen">REVIEWED EXPERIENCE MAY RETURN AS FUTURE MEMORY</text>
</svg>
