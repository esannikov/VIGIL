<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">VIGIL v6 alpha system architecture</title>
  <desc id="desc">An arXiv-style pipeline showing VIGIL world reading, text-level concept criticism, image generation, visual criticism, machine choice, trace, reflective Hindsight memory, and human calibration.</desc>

  <defs>
    <marker id="arrowBlack" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#181818"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7650aa"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2c8835"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #171717; }
      .figureLabel { font-size: 24px; font-weight: 600; }
      .groupLabel { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; }
      .nodeTitle { font-size: 28px; font-weight: 760; text-anchor: middle; }
      .sideTitle { font-size: 22px; font-weight: 760; text-anchor: middle; }
      .nodeCopy { font-size: 19px; font-weight: 400; text-anchor: middle; fill: #333a44; }
      .node { fill: #f4f9fe; stroke: #2f78bb; stroke-width: 2; }
      .memoryNode { fill: #f6f1fb; stroke: #7650aa; stroke-width: 2; }
      .humanNode { fill: #f2faef; stroke: #2c8835; stroke-width: 2; }
      .mainFlow { fill: none; stroke: #181818; stroke-width: 2.5; marker-end: url(#arrowBlack); }
      .writeFlow { fill: none; stroke: #7650aa; stroke-width: 2; }
      .writeArrow { fill: none; stroke: #7650aa; stroke-width: 2.5; marker-end: url(#arrowViolet); }
      .recallFlow { fill: none; stroke: #7650aa; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrowViolet); }
      .returnFlow { fill: none; stroke: #2c8835; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrowGreen); }
      .flowLabel { font-size: 15px; font-weight: 650; letter-spacing: 0.4px; }
      .violetText { fill: #7650aa; }
      .greenText { fill: #2c8835; }
      .bracket { fill: none; stroke: #171717; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="1800" fill="#ffffff"/>
  <text x="36" y="44" class="figureLabel">VIGIL v6 alpha</text>

  <!-- Group labels -->
  <path d="M185 70 H165 V460 H185" class="bracket"/>
  <text x="50" y="245" class="groupLabel">WORLD</text>

  <path d="M185 510 H165 V1180 H185" class="bracket"/>
  <text x="35" y="825" class="groupLabel">ARTISTIC</text>
  <text x="55" y="854" class="groupLabel">CYCLE</text>

  <path d="M185 1250 H165 V1500 H185" class="bracket"/>
  <text x="35" y="1320" class="groupLabel">HUMAN</text>
  <text x="35" y="1348" class="groupLabel">REVIEW /</text>
  <text x="35" y="1376" class="groupLabel">CALIBRATION</text>
  <text x="35" y="1405" font-size="15" fill="#52605b">current research phase</text>

  <text x="930" y="492" class="groupLabel violetText">MEMORY</text>

  <!-- Main pipeline -->
  <g>
    <rect x="240" y="70" width="540" height="110" class="node"/>
    <text x="510" y="116" class="nodeTitle">OPEN SOURCES</text>
    <text x="510" y="151" class="nodeCopy">Collects events, attention and slow context.</text>

    <rect x="240" y="210" width="540" height="110" class="node"/>
    <text x="510" y="256" class="nodeTitle">EVIDENCE PACKET</text>
    <text x="510" y="291" class="nodeCopy">Binds sources, confidence and claim limits.</text>

    <rect x="240" y="350" width="540" height="110" class="node"/>
    <text x="510" y="396" class="nodeTitle">WORLD READER</text>
    <text x="510" y="431" class="nodeCopy">Forms one bounded tension of the day.</text>

    <rect x="240" y="510" width="540" height="110" class="node"/>
    <text x="510" y="556" class="nodeTitle">ARTISTIC REASONER</text>
    <text x="510" y="591" class="nodeCopy">Develops five distinct visual positions.</text>

    <rect x="240" y="650" width="540" height="110" class="node"/>
    <text x="510" y="696" class="nodeTitle">CONCEPT CRITIC</text>
    <text x="510" y="731" class="nodeCopy">Compares written concepts before image generation.</text>

    <rect x="240" y="790" width="540" height="110" class="node"/>
    <text x="510" y="836" class="nodeTitle">IMAGE GENERATION</text>
    <text x="510" y="871" class="nodeCopy">Produces five candidate images.</text>

    <rect x="240" y="930" width="540" height="110" class="node"/>
    <text x="510" y="976" class="nodeTitle">VISUAL CRITIC</text>
    <text x="510" y="1007" class="nodeCopy">Reads finished images before seeing</text>
    <text x="510" y="1030" class="nodeCopy">their intended meaning.</text>

    <rect x="240" y="1070" width="540" height="110" class="node"/>
    <text x="510" y="1116" class="nodeTitle">MACHINE CHOICE</text>
    <text x="510" y="1151" class="nodeCopy">Fixes one work before human review.</text>

    <rect x="240" y="1250" width="540" height="110" class="humanNode"/>
    <text x="510" y="1296" class="nodeTitle">HUMAN VERDICT</text>
    <text x="510" y="1331" class="nodeCopy">During research, accepts, rejects or corrects the choice.</text>

    <rect x="240" y="1390" width="540" height="110" class="humanNode"/>
    <text x="510" y="1436" class="nodeTitle">RELEASE / PROMOTION</text>
    <text x="510" y="1471" class="nodeCopy">Publishes work and promotes reviewed methods.</text>
  </g>

  <path d="M510 180 V205" class="mainFlow"/>
  <path d="M510 320 V345" class="mainFlow"/>
  <path d="M510 460 V505" class="mainFlow"/>
  <path d="M510 620 V645" class="mainFlow"/>
  <path d="M510 760 V785" class="mainFlow"/>
  <path d="M510 900 V925" class="mainFlow"/>
  <path d="M510 1040 V1065" class="mainFlow"/>
  <path d="M510 1180 V1245" class="mainFlow"/>
  <path d="M510 1360 V1385" class="mainFlow"/>

  <!-- Trace -->
  <rect x="880" y="530" width="300" height="350" class="memoryNode"/>
  <text x="1030" y="670" class="sideTitle">APPEND-ONLY TRACE</text>
  <text x="1030" y="712" class="nodeCopy">Records sources, prompts,</text>
  <text x="1030" y="740" class="nodeCopy">images and decisions.</text>

  <path d="M780 565 H840 M780 705 H840 M780 845 H840 M780 985 H840 M780 1125 H840 M840 565 V1125" class="writeFlow"/>
  <path d="M840 705 H875" class="writeArrow"/>
  <text x="805" y="683" class="flowLabel violetText">record</text>

  <!-- Reflective memory -->
  <rect x="880" y="950" width="300" height="230" class="memoryNode"/>
  <text x="1030" y="1002" class="sideTitle">HINDSIGHT MEMORY</text>
  <text x="1030" y="1045" class="nodeCopy">Accumulates VIGIL's</text>
  <text x="1030" y="1073" class="nodeCopy">reflections on itself,</text>
  <text x="1030" y="1101" class="nodeCopy">the world and its works.</text>

  <path d="M880 1050 H810 V565 H785" class="recallFlow"/>
  <text x="818" y="1030" class="flowLabel violetText">recall</text>

  <!-- Reviewed experience may enter future memory -->
  <path d="M780 1445 H850 V1560 H1035 V1185" class="returnFlow"/>
  <text x="865" y="1544" class="flowLabel greenText">promote after review</text>

  <line x1="35" y1="1645" x2="1165" y2="1645" stroke="#c8cdd3" stroke-width="1"/>
  <text x="35" y="1680" font-size="16" fill="#66707b">Black: forward cycle</text>
  <text x="260" y="1680" font-size="16" fill="#7650aa">Violet: trace and reflective recall</text>
  <text x="610" y="1680" font-size="16" fill="#2c8835">Green: human-reviewed promotion</text>
</svg>
